name: Pitching Deploy

# Builds the widget-pitching container (amd64) and deploys it to the slugger-pitching
# ECS Fargate service behind the shared slugger-alb at /widgets/pitching/*.
# Auth is via GitHub OIDC (role github-actions-deploy) — no static AWS keys.
# The task definition (aws/task-definition.json) captures cpu/mem/env/secrets so the
# deploy is reproducible; render-task-definition only swaps in the freshly built image.

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!**.md'
  workflow_dispatch:

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: widget-pitching
  ECS_SERVICE: slugger-pitching-service
  ECS_CLUSTER: slugger-cluster
  CONTAINER_NAME: slugger-pitching
  TASK_DEF: aws/task-definition.json

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: pitching-cicd

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build & push image (amd64)
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker buildx build --platform linux/amd64 \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            --provenance=false --push .

      - name: Render task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.TASK_DEF }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Smoke test
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
              "https://www.alpb-analytics.com/widgets/pitching/" || echo 000)
            if [ "$code" = "200" ]; then echo "Smoke OK ($code) on attempt $i"; exit 0; fi
            echo "attempt $i: HTTP $code — retrying in 15s"; sleep 15
          done
          echo "Smoke FAILED after 10 attempts"; exit 1
